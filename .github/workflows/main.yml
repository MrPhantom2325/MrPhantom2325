name: Generate Snake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ✅ Updated checkout
      - uses: actions/checkout@v4

      # ✅ Updated snake action (stable version)
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: YOUR_USERNAME   # <-- change this
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake.gif

      # Debug
      - run: ls -la dist

      # ✅ Push using GitHub Pages action (updated)
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
